name: aura_dairy
description: Aura Dairy (FarmOS) staff app for Android and iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.22.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/icon/icon-512.png
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: BalooDa2
      fonts:
        - asset: assets/fonts/BalooDa2.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

# dart run flutter_launcher_icons — icons from the web app (frontend/public/icons).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon-512.png
  adaptive_icon_background: "#166534"
  adaptive_icon_foreground: assets/icon/icon-maskable-512.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#166534"
